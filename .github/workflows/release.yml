name: Release

# After a PR is merged, bump the version from its title (fix → patch,
# feat → minor, ! / BREAKING CHANGE → major), update the changelog, tag and
# publish a GitHub release. Titles like docs:/chore:/ci: release nothing.
# Package Control picks up new tags by itself (docs/RELEASING.md).
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      # Never the PR head: this job can push to main. The deploy key is the
      # only identity allowed past main's ruleset (docs/RELEASING.md).
      - uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v10.3.0
      - id: bump
        # Title and body arrive through env, never interpolated into the script.
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/release/bump.mjs "$TITLE" "$BODY" "$PR"
      # uv.lock records the project version too; CI runs `uv sync --locked`.
      - if: steps.bump.outputs.version
        run: uv lock
      - if: steps.bump.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          NOTES: ${{ steps.bump.outputs.notes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release v$VERSION"
          git tag "v$VERSION"
          git push origin main "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes "$NOTES"
